name: Bug Report
description: Report a bug in hypofuse
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: hypofuse version
      description: "Output of `hypofuse --version` or `hypofuse.__version__`."
      placeholder: "0.1.x"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible snippet
      description: >
        Paste the smallest code block or CLI invocation that reproduces the
        issue.  Include the exact command if the bug is in the CLI.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: dropdown
    id: data-type
    attributes:
      label: Data type
      description: >
        Is your data synthetic or a real manifest?
        Do NOT attach proprietary audio or transcripts.
      options:
        - Synthetic (generated by hypofuse demo or similar)
        - Real manifest (non-proprietary)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: search
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
