[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypofuse"
version = "0.1.1"
description = "Speech recognition post-processing toolkit: n-best fusion, alignment, LM rescoring, calibration and error analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Zheng Haodi", email = "237059476+hawaiicoco@users.noreply.github.com" },
]
keywords = ["speech-recognition", "asr", "fusion", "rover", "language-model", "calibration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "wheel>=0.42",
    "hatchling>=1.25",
    "mypy>=1.10",
]
torch = [
    "torch>=2.2",
]

[project.scripts]
hypofuse = "hypofuse.cli:main"

[project.urls]
Homepage = "https://github.com/hawaiicoco/hypofuse"
Issues = "https://github.com/hawaiicoco/hypofuse/issues"
Changelog = "https://github.com/hawaiicoco/hypofuse/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hypofuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "model: marks tests that require the optional torch extra",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "RUF001"]
"examples/**/*.py" = ["B011", "RUF001"]
"src/hypofuse/normalize.py" = ["RUF001"]

[tool.mypy]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true